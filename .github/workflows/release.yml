name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release with card file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/sol-luna-card.js --clobber
          else
            gh release create "$TAG" dist/sol-luna-card.js \
              --title "$TAG" \
              --notes "Sol & Luna Card $TAG – Installation über HACS oder manuell: sol-luna-card.js nach /config/www/ kopieren."
          fi
